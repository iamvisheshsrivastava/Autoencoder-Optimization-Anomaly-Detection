name: Keep HuggingFace Space awake

on:
  schedule:
    # Every 20 minutes - HF's free-tier Spaces sleep after a period of
    # inactivity; a periodic hit resets that clock so the demo stays warm
    # for anyone clicking the link (e.g. from a CV/portfolio).
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://visheshsrivastava-autoencoder-anomaly-detection.hf.space/"
