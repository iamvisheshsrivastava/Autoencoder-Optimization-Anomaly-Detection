name: Keep HuggingFace Space awake

on:
  schedule:
    # Every 20 minutes - HF's free-tier Spaces sleep after a period of
    # inactivity; a periodic hit resets that clock so the demo stays warm
    # for anyone clicking the link (e.g. from a CV/portfolio).
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        run: |
          # Must be iamvisheshsrivastava-... (the actual Space owner/slug) --
          # the old visheshsrivastava-... host 404s, so this workflow was
          # reporting "success" on every run without ever waking the real
          # Space (#37).
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://iamvisheshsrivastava-autoencoder-anomaly-detection.hf.space/")
          echo "HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "Ping failed with HTTP $code"
            exit 1
          fi
