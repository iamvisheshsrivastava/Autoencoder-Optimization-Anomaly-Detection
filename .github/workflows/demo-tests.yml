name: Demo app tests

# The paper/experiments live in a Jupyter notebook, which isn't something
# CI can meaningfully test. demo/app.py is the one piece of plain Python
# in this repo, so this workflow covers just that: run the offline smoke
# tests in demo/test_app.py (no HuggingFace Hub access, no model download)
# whenever demo/ changes.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/demo-tests.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo-tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run offline smoke tests
        run: pytest test_app.py -v
